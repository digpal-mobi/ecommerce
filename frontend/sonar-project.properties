# SonarQube scanner configuration for this repo/branch
# Project identification
sonar.projectKey=ecommerce-frontend
sonar.projectName=Ecommerce Frontend
sonar.projectVersion=1.0.0

# Sources — application code plus root config files
sonar.sources=src,eslint.config.mjs,next.config.ts,postcss.config.mjs
sonar.sourceEncoding=UTF-8

# Language / file extensions to analyse
sonar.javascript.file.suffixes=.js,.jsx,.mjs
sonar.typescript.file.suffixes=.ts,.tsx

# Common exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/out/**,\
  **/build/**,\
  **/dist/**,\
  **/public/**,\
  **/*.test.*,\
  **/*.spec.*,\
  **/__tests__/**,\
  **/coverage/**,\
  **/*.min.*,\
  **/src/app/fonts/**,\
  **/*.woff2,\
  **/*.woff,\
  **/*.otf,\
  **/*.ttf,\
  **/*.eot
